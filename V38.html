*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.calculator{width:min(430px,100vw);margin:auto;min-height:100vh;padding:18px 14px 25px;display:flex;flex-direction:column;justify-content:flex-end}
.display{height:155px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;padding:10px 8px 14px;overflow:hidden;word-break:break-all}.history{height:30px;width:100%;text-align:right;color:#8e8e93;font-size:20px;line-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.display-main{font-size:52px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.key{height:76px;border:0;border-radius:50%;font-size:28px;color:#fff;background:#333;cursor:pointer}.key.light{background:#a5a5a5;color:#000}.key.op{background:#ff9500}.key.zero{grid-column:span 2;border-radius:40px;text-align:left;padding-left:29px}
#vault{display:none;min-height:100vh;background:#070910;padding:18px;color:#fff}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #293246;padding-bottom:15px}.brand{font-weight:900;letter-spacing:2px}.brand b{color:#a78bfa}.btn{background:#20283a;color:#fff;border:0;border-radius:10px;padding:10px 13px;font-weight:700}.hero{margin:18px 0;padding:18px;border:1px solid #303b50;border-radius:20px;background:#111725}.hero h2{margin:0 0 5px}.muted{color:#8f9aae;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.primary{background:#7c3aed}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#111725;border:1px solid #293449;border-radius:13px;overflow:hidden}.preview{aspect-ratio:1;background:#05070b;display:grid;place-items:center}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.preview{cursor:pointer}.media-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:20px}.media-modal.show{display:flex}.media-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:52px;height:52px;border:0;border-radius:50%;background:rgba(32,40,58,.9);color:#fff;font-size:42px;line-height:45px;cursor:pointer}.media-prev{left:18px}.media-next{right:18px}.media-modal-content{width:min(96vw,1000px);height:min(92vh,900px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.media-modal img,.media-modal video{max-width:100%;max-height:calc(100% - 60px);object-fit:contain;border-radius:10px}.media-modal-actions{display:flex;gap:10px}.media-modal-actions button,.media-modal-actions a{background:#20283a;color:#fff;border:0;border-radius:10px;padding:10px 16px;text-decoration:none;font-weight:700}.media-modal-actions a{background:#7c3aed}.media-close{position:absolute;top:18px;right:18px;font-size:28px;background:#20283a!important;border-radius:50%!important;width:48px;height:48px;padding:0!important}.meta{padding:9px}.name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small{font-size:10px;color:#8f9aae}.danger{background:#541923}.empty{text-align:center;color:#8f9aae;padding:45px 10px;border:1px dashed #303b50;border-radius:16px}input[type=file]{display:none}
#pin{display:none;min-height:100vh;background:radial-gradient(circle at 50% 15%,#281653,#070910 45%);align-items:center;justify-content:center;padding:20px}.pinbox{width:min(380px,100%);background:#111725;border:1px solid #303b50;border-radius:24px;padding:25px;text-align:center}.pin{font-size:35px;letter-spacing:10px;margin:22px 0;color:#fff}.pin .pin-filled{font-size:25px;display:inline-block;vertical-align:middle;line-height:1}.pinmsg{color:#f87171;height:22px}.pinbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pinbtn{height:62px;border:0;border-radius:15px;background:#20283a;color:#fff;font-size:22px}.pinbtn.clear{background:#4a1820}

.v33-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.v33-tools select{background:#20283a;color:#fff;border:1px solid #33415a;border-radius:10px;padding:9px 12px;font-weight:700}.v33-context{display:none;position:fixed;z-index:500;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px}.v33-context.show{display:flex}.v33-context-box{width:min(360px,100%);background:#111725;border:1px solid #303b50;border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.65)}.v33-context-box button{width:100%;margin-top:8px}.v33-history{display:none;position:fixed;inset:0;z-index:510;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:20px}.v33-history.show{display:flex}.v33-history-box{width:min(430px,100%);max-height:75vh;overflow:auto;background:#111725;border:1px solid #303b50;border-radius:20px;padding:18px;color:#fff}.v33-history-row{padding:10px 0;border-bottom:1px solid #293449;display:flex;justify-content:space-between;gap:12px;align-items:center}.v33-auth-row{min-height:110px}.v33-auth-row{display:flex!important;justify-content:center!important;align-items:center!important;padding:18px 0!important}.auth-shake-btn{width:100px;height:100px;min-width:100px;border:0;border-radius:50%;background:#ff9500;color:#fff;box-shadow:0 4px 16px rgba(255,149,0,.25);font-size:22px;font-weight:900;touch-action:none;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}.auth-shake-btn.holding{transform:scale(.96);box-shadow:0 0 0 4px rgba(255,149,0,.18),0 4px 16px rgba(255,149,0,.35)}.auth-shake-status{display:none!important}.pin-show-btn{display:none}.v33-zoomable{touch-action:none;transform-origin:center center;will-change:transform}.media-modal-content{touch-action:none}

<body>
<div id="calc" class="calculator">
 <div id="display" class="display"><div id="historyText" class="history"></div><span id="displayText" class="display-main">0</span></div>
 <div class="keys">
  <button id="acButton" class="key light" onclick="acTap()">AC</button><button class="key light" onclick="back()">⌫</button><button class="key light" onclick="percent()">%</button><button class="key op" onclick="op('/')">÷</button>
  <button class="key" onclick="num('7')">7</button><button class="key" onclick="num('8')">8</button><button class="key" onclick="num('9')">9</button><button class="key op" onclick="op('*')">×</button>
  <button class="key" onclick="num('4')">4</button><button class="key" onclick="num('5')">5</button><button class="key" onclick="num('6')">6</button><button class="key op" onclick="op('-')">−</button>
  <button class="key" onclick="num('1')">1</button><button class="key" onclick="num('2')">2</button><button class="key" onclick="num('3')">3</button><button class="key op" onclick="op('+')">＋</button>
  <button class="key zero" onclick="num('0')">0</button><button class="key" onclick="dot()">.</button><button id="unlockArrow" class="key op" onclick="equalsTap()">＝</button>
 </div>
</div>

<div id="pin">
 <div class="pinbox">
  <div style="font-size:34px">🔐</div><h2>SECRET VAULT</h2><div class="muted">パスワードを入力してください</div>
  <div id="pintext" class="pin">••••</div><div id="pinmsg" class="pinmsg"></div>
  <div class="pinbtns">
   <button class="pinbtn" onclick="p('1')">1</button><button class="pinbtn" onclick="p('2')">2</button><button class="pinbtn" onclick="p('3')">3</button>
   <button class="pinbtn" onclick="p('4')">4</button><button class="pinbtn" onclick="p('5')">5</button><button class="pinbtn" onclick="p('6')">6</button>
   <button class="pinbtn" onclick="p('7')">7</button><button class="pinbtn" onclick="p('8')">8</button><button class="pinbtn" onclick="p('9')">9</button>
   <button class="pinbtn clear" onclick="pc()">⌫</button><button class="pinbtn" onclick="p('0')">0</button><button class="pinbtn clear" onclick="closePin()">×</button>
  </div>
 </div>
</div>

<div id="vault">
 <div class="top"><div class="brand">SECRET <b>VAULT</b></div><div style="display:flex;align-items:center;gap:7px"><button class="btn" onclick="changeMainPassword()">🔑 メインパスワードを変更</button><button class="btn" onclick="lock()">🔒 閉じる</button></div></div>
 <div class="hero"><h2>写真・動画</h2><div class="muted">この端末のブラウザ内に保存</div>
  <div class="actions"><label class="btn primary">＋ 追加<input id="files" type="file" accept="image/*,video/*" multiple></label><button class="btn" onclick="newFolder()">＋ フォルダー</button></div>
  <div class="v33-tools"><label class="muted">並び替え <select id="sortSelect" onchange="setVaultSort(this.value)"><option value="new">新しい順</option><option value="old">古い順</option><option value="name">名前順</option></select></label><label class="muted">ゴミ箱自動削除 <select id="trashRetention" onchange="setTrashRetention(this.value)"><option value="0">なし</option><option value="7">7日</option><option value="30">30日</option><option value="90">90日</option></select></label></div>
 </div>
 <div id="folders" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px"></div>
 <div id="folderHeader" style="display:none;margin-bottom:14px"></div>
 <div id="selectionBar" style="display:none;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
  <button class="btn" onclick="toggleSelectionMode()">☑ 選択</button><button class="btn" onclick="toggleSelectAll()">☑ すべて選択</button><button class="btn primary" onclick="downloadSelected()">⬇ 選択をダウンロード</button><button id="bulkTrashBtn" class="btn danger" onclick="trashSelected()">🗑 選択をゴミ箱へ</button><button id="bulkRestoreBtn" class="btn" style="display:none" onclick="restoreSelected()">↩ 選択を復元</button><button id="bulkDeleteBtn" class="btn danger" style="display:none" onclick="deleteSelectedForever()">完全に削除</button><button id="bulkMoveBtn" class="btn" style="display:none" onclick="moveSelectedToFolder()">📁 このフォルダーに入れる</button><span id="selectedCount" class="muted">0件選択</span>
 </div>
 <div id="grid" class="grid"></div>
</div>

<div id="v33Context" class="v33-context" onclick="if(event.target===this)closeV33Context()"><div class="v33-context-box"><div id="v33ContextTitle" style="font-size:18px;font-weight:800"></div><button class="btn" onclick="v33OpenFromContext()">🔍 開く</button><button class="btn" onclick="v33MoveFromContext()">📁 フォルダーへ移動</button><button class="btn" onclick="v33PasswordFromContext()">🔐 パスワード</button><button class="btn danger" onclick="v33TrashFromContext()">🗑 ゴミ箱へ</button><button class="btn" onclick="closeV33Context()">キャンセル</button></div></div>
<div id="v33History" class="v33-history" onclick="if(event.target===this)closeV33History()"><div class="v33-history-box"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">計算履歴</h3><button class="btn" onclick="closeV33History()">×</button></div><div id="v33HistoryList" style="margin-top:10px"></div><div id="v33AuthHistoryRow" class="v33-history-row v33-auth-row" style="display:none"><button id="authShakeButton" class="auth-shake-btn" aria-label="認証ボタン"> </button></div><div id="v33AuthStatus" class="auth-shake-status" style="display:none"></div></div></div>
<div id="mediaModal" class="media-modal" onclick="if(event.target===this)closeMedia()"><button class="media-close" onclick="closeMedia()">×</button><button class="media-nav media-prev" onclick="event.stopPropagation();changeMedia(-1)">‹</button><button class="media-nav media-next" onclick="event.stopPropagation();changeMedia(1)">›</button><div class="media-modal-content"><div id="mediaViewer"></div><div class="media-modal-actions"><a id="mediaDownload" href="#" download style="display:none">⬇ ダウンロード</a><button onclick="closeMedia()">閉じる</button></div></div></div>

<div id="folderMoveModal" class="password-modal" onclick="if(event.target===this)closeFolderMoveModal()">
  <div class="password-box">
    <div style="font-size:20px;font-weight:800">📁 移動先フォルダー</div>
    <div class="muted" style="margin-top:6px">選択した写真・動画を入れるフォルダーを選んでください。</div>
    <div id="folderMoveList" style="display:grid;gap:8px;margin-top:16px"></div>
    <div class="password-actions"><button class="btn" onclick="closeFolderMoveModal()">キャンセル</button></div>
  </div>
</div>
<div id="passwordModal" class="password-modal" onclick="if(event.target===this)closePasswordModal()">
  <div class="password-box">
    <div id="passwordPreview" style="display:none;margin:0 auto 14px;width:min(100%,420px);max-height:62vh;min-height:120px;background:#05070b;border-radius:14px;overflow:auto;align-items:center;justify-content:center"></div>
    <div id="passwordTitle" style="font-size:20px;font-weight:800">🔒 パスワード</div>
    <div id="passwordMessage" class="muted" style="margin-top:6px"></div>
    <div id="passwordFields"></div>
    <div style="display:flex;gap:7px;align-items:center"><input id="passwordInput" type="password" inputmode="numeric" maxlength="20" placeholder="パスワード" style="flex:1"><button id="passwordEye" class="btn" type="button" onclick="togglePasswordVisibility()">👁</button></div>
    <div class="password-actions">
      <button class="btn" onclick="closePasswordModal()">キャンセル</button>
      <button class="btn primary" onclick="submitProtectedAction()">OK</button>
    </div>
  </div>
</div>
<script>
const DEFAULT_PASS="1234",DB="CalcVault",STORE="media";
let db,entered="",secret=false,current="__photos__",selectionMode=false,renderSeq=0;
const getMainPassword=()=>localStorage.getItem("vaultMainPassword")||DEFAULT_PASS;
let passwordAction=null,passwordPreviewUrl=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE))e.target.result.createObjectStore(STORE,{keyPath:"id",autoIncrement:true})};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=()=>rej(r.error)})}
function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(x){return new Promise((res,rej)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).put(x);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}

let cur="0",prev=null,operator=null,reset=false,acClicks=0,acTimer=null,unlockStage=0;
let authHolding=false,authShakeCount=0,authLastShake=0,authLastMotion=null,authMotionBound=false,authPermissionAsked=false;
function show(){const d=$("displayText");if(d)d.textContent=cur}
function showHistory(t){const h=$("historyText");if(h)h.textContent=t||""}
function sym(o){return {"+":"+","-":"−","*":"×","/":"÷"}[o]||""}
function mainExpr(){if(prev!==null&&operator!==null){$("displayText").textContent=String(prev)+sym(operator)+(reset?"":cur)}else show()}
function num(n){if(unlockStage===1){cancelAuthStart();clearCalc();acClicks=0;clearTimeout(acTimer);return}if(reset){cur=n;reset=false}else if(cur==="0")cur=n;else if(cur.length<14)cur+=n;mainExpr()}
function dot(){if(unlockStage===1){cancelAuthStart();clearCalc();acClicks=0;clearTimeout(acTimer);return}if(reset){cur="0";reset=false}if(!cur.includes("."))cur+=".";mainExpr()}
function clearCalc(){cur="0";prev=null;operator=null;reset=false;showHistory("");show()}
function back(){if(unlockStage===1){cancelAuthStart();clearCalc();acClicks=0;clearTimeout(acTimer);return}cur=cur.length>1?cur.slice(0,-1):"0";mainExpr()}
function op(o){if(unlockStage===1){cancelAuthStart();clearCalc();acClicks=0;clearTimeout(acTimer);return}if(prev!==null&&operator!==null&&!reset)equal();prev=parseFloat(cur);operator=o;reset=true;mainExpr()}
function equal(){if(prev===null||operator===null)return;let b=parseFloat(cur),a=prev,r=operator==="+"?a+b:operator==="-"?a-b:operator==="*"?a*b:a/b;const expr=String(a)+sym(operator)+String(b);showHistory(expr);saveCalcHistory(expr);cur=String(Math.round(r*1e10)/1e10);prev=null;operator=null;reset=true;show()}
function percent(){if(unlockStage===1){cancelAuthStart();clearCalc();acClicks=0;clearTimeout(acTimer);return}cur=String(parseFloat(cur)/100);mainExpr()}
function showLockHint(){ }

function beginAuthStage1(){
  // AC×3の直後は、まだ「1」にしない。「＝」を押すまで通常表示を維持。
  cur="0";prev=null;operator=null;reset=false;showHistory("");show();
  // AC×3の直後は「＝」待ち。ここではまだ2段階目を開始しない.
  unlockStage=1;
  const a=$("unlockArrow");if(a){a.textContent="＝";a.disabled=false;a.style.opacity="1";}
  hideAuthHistoryButton();
}
function showAuthHistoryButton(){
  const row=$("v33AuthHistoryRow"),status=$("v33AuthStatus");
  if(row)row.style.display="flex";
  if(status){status.style.display="block";status.textContent="";}
}
function hideAuthHistoryButton(){
  const row=$("v33AuthHistoryRow"),status=$("v33AuthStatus");
  if(row)row.style.display="none";
  if(status)status.style.display="none";
}
function cancelAuthStart(){
  unlockStage=0;authHolding=false;authShakeCount=0;authLastShake=0;authLastMotion=null;
  hideAuthHistoryButton();
}
function openAuthHistory(){
  openV33History();
  if(unlockStage===2)showAuthHistoryButton();
}
function finishShakeAuth(){
  if(unlockStage!==2)return;
  authHolding=false;unlockStage=2;authShakeCount=0;authLastMotion=null;
  const btn=$("authShakeButton");if(btn){btn.classList.remove("holding");btn.textContent="OK"}
  const status=$("v33AuthStatus");if(status)status.textContent="";
  setTimeout(()=>{closeV33History();startPasswordStage()},350);
}
function updateAuthShakeUI(msg){
  const btn=$("authShakeButton"),status=$("v33AuthStatus");
  if(btn)btn.textContent="";
  if(status)status.textContent="";
}
function startPasswordStage(){
  // 3段階目の開始時も必ず「1」からスタート。
  cur="1";prev=null;operator=null;reset=false;show();
  const calc=$("calc"),pin=$("pin");
  calc.style.display="none";pin.style.display="flex";
  requestAnimationFrame(()=>pin.classList.add("showpin"));
  entered="";$("pinmsg").textContent="";updatePin();
}
async function requestMotionPermission(){
  try{
    if(typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
      if(authPermissionAsked)return true;
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=="granted")throw new Error("motion permission denied");
      authPermissionAsked=true;
    }
    return true;
  }catch(e){
    authPermissionAsked=false;
    const status=$("v33AuthStatus");if(status)status.textContent="";
    return false;
  }
}
function onAuthMotion(e){
  if(!authHolding||unlockStage!==2)return;
  // iPhone/Androidで取得できる方を優先して使う。
  const a=e.accelerationIncludingGravity||e.acceleration;
  if(!a)return;
  const x=Number(a.x)||0,y=Number(a.y)||0,z=Number(a.z)||0;
  const mag=Math.sqrt(x*x+y*y+z*z);
  const now=Date.now();
  if(!Number.isFinite(mag))return;
  if(authLastMotion===null){authLastMotion=mag;return}
  const delta=Math.abs(mag-authLastMotion);
  authLastMotion=mag;
  // 軽めの振りでも拾えるようにしつつ、同じ振りを連続カウントしない。
  if(delta>2.0 && mag>2.0 && now-authLastShake>450){
    authLastShake=now;authShakeCount++;
    updateAuthShakeUI("");
    if(authShakeCount>=2)finishShakeAuth();
  }
}
function startAuthHold(e){
  if(unlockStage!==2)return;
  if(e){e.preventDefault();e.stopPropagation()}
  authHolding=true;authShakeCount=0;authLastShake=0;authLastMotion=null;
  const btn=$("authShakeButton");
  if(btn){
    btn.classList.add("holding");btn.textContent="";
    try{if(e&&e.pointerId!=null)btn.setPointerCapture(e.pointerId)}catch(_){}
  }
  updateAuthShakeUI("");
  if(!authMotionBound){window.addEventListener("devicemotion",onAuthMotion,{passive:true});authMotionBound=true}
  requestMotionPermission();
}
function endAuthHold(e){
  if(unlockStage!==2)return;
  authHolding=false;authLastMotion=null;
  const btn=$("authShakeButton");if(btn)btn.classList.remove("holding");
}
function equalsTap(){
  // AC×3の後は「＝」を押して2段階目へ進む。
  if(unlockStage===1){
    // AC×3の後に「＝」を1回押したら、ここで初めて「1」を表示して次段階へ。
    cur="1";prev=null;operator=null;reset=false;showHistory("");show();
    unlockStage=2;
    // 「＝」を押しただけでは計算履歴を開かない。
    // ユーザーが通常の「計算履歴」ボタンを押したときだけ表示する。
    hideAuthHistoryButton();
    return;
  }
  equal();
}
function acTap(){
  // AC×3の後にもう一度ACを押した場合も「途中で別の操作をした」扱いで全リセット。
  if(unlockStage===1){cancelAuthStart();clearCalc();acClicks=0;clearTimeout(acTimer);return;}
  clearCalc();
  acClicks++;
  clearTimeout(acTimer);
  acTimer=setTimeout(()=>{acClicks=0},2000);
  if(acClicks===3){
    acClicks=0;clearTimeout(acTimer);
    beginAuthStage1();
  }
}

function p(n){if(entered.length<4){entered+=n;updatePin();if(entered.length===4)setTimeout(check,120)}}
function pc(){entered=entered.slice(0,-1);updatePin()}
function updatePin(){let html="";for(let i=0;i<4;i++){html+=i<entered.length?'<span class="pin-filled">●</span>':"•";} $("pintext").innerHTML=html}
function check(){if(entered===getMainPassword()){
  $("pin").style.display="none";
  $("calc").style.display="none";
  $("vault").style.display="block";
  secret=true;
  unlockStage=3;

async function openMedia(id){

  // フォルダーAから開いた場合、矢印でもA以外の写真には移動しない。
  if(current!=="__photos__" && current!=="__folders__" && current!=="__trash__"){
    mediaItems=allItems.filter(v=>(v.folder||"未分類")===current);
  }else if(current==="__photos__"){
    mediaItems=allItems;
  }else{

  }
  mediaIndex=mediaItems.findIndex(v=>v.id===id);
  if(mediaIndex<0)return;
  renderMedia();
  $("mediaModal").classList.add("show");
}
function renderMedia(){
  const x=mediaItems[mediaIndex];
  if(!x)return;
  if(activeMediaUrl)URL.revokeObjectURL(activeMediaUrl);
  activeMediaUrl=URL.createObjectURL(x.blob);
  const viewer=$("mediaViewer");
  viewer.innerHTML="";
  const el=document.createElement(x.type.startsWith("video")?"video":"img");
  el.src=activeMediaUrl;
  if(x.type.startsWith("video")){el.controls=true;el.autoplay=true;el.playsInline=true}
  viewer.appendChild(el);
  const dl=$("mediaDownload");

  dl.download=x.name||"download";
}
async function changeMedia(dir){

async function deleteFolder(folder){
  folder=String(folder||"").trim();
  if(!folder)return;
  const a=await all();
  const count=a.filter(x=>(x.folder||"未分類")===folder && !x.trashed).length;
  const msg=count
    ? `「${folder}」を削除しますか？\n中にある${count}件の写真・動画は「未分類」に戻ります。`
    : `「${folder}」を削除しますか？`;
  if(!confirm(msg))return;
  for(const x of a){
    if((x.folder||"未分類")===folder){
      x.folder="未分類";
      await put(x);
    }
  }
  folderNamesSaved=folderNamesSaved.filter(f=>f!==folder);
  delete folderPasswords[folder];
  localStorage.setItem("vaultFolderNames",JSON.stringify(folderNamesSaved));
  saveFolderPasswords();
  if(current===folder)current="__folders__";
  selectionMode=false;
  await render();
}

  const old=folderPasswords[folder];
  askPassword(old?"🔑 フォルダーパスワードを変更":"🔐 フォルダーパスワードを設定","新しいパスワードを入力してください。",value=>{
    if(!value){$("passwordMessage").textContent="パスワードを入力してください";return}
    folderPasswords[folder]=value;saveFolderPasswords();closePasswordModal();render();
  });
}

function closeV33History(){$("v33History").classList.remove("show");hideAuthHistoryButton()}
function togglePasswordVisibility(){const i=$("passwordInput"),b=$("passwordEye");if(!i)return;i.type=i.type==="password"?"text":"password";if(b)b.textContent=i.type==="password"?"👁":"🙈"}
function scheduleV33AutoLock(){
  clearTimeout(v33LockTimer);
  const mins=Number(localStorage.getItem("vaultAutoLockMinutes")||1);
  if(!secret||!mins)return;
  v33LockTimer=setTimeout(()=>{if(secret)lock()},mins*60000);
}
function v33Activity(){if(secret)scheduleV33AutoLock()}
function setVaultSort(v){localStorage.setItem("vaultSort",v);render()}
function setTrashRetention(v){localStorage.setItem("vaultTrashRetention",v);cleanupTrash();render()}
async function cleanupTrash(){
  const days=Number(localStorage.getItem("vaultTrashRetention")||0);if(!days)return;
  const cutoff=Date.now()-days*86400000,a=await all();
  for(const x of a)if(x.trashed && x.trashedAt && x.trashedAt<cutoff)await del(x.id);
}
function getVaultSort(){return localStorage.getItem("vaultSort")||"new"}
function sortMedia(list){const mode=getVaultSort();return list.sort((a,b)=>{
  if(mode==="name")return String(a.name||"").localeCompare(String(b.name||""),"ja");
  const at=a.createdAt||a.id||0,bt=b.createdAt||b.id||0;return mode==="old"?at-bt:bt-at;
})}
function v33OpenFromContext(){const id=v33ContextId;closeV33Context();if(id!=null)openMediaProtected(id)}
function v33MoveFromContext(){const id=v33ContextId;closeV33Context();if(id!=null){document.querySelectorAll('.mediaSelect').forEach(c=>c.checked=false);const cb=document.querySelector(`.mediaSelect[data-id="${id}"]`);if(cb)cb.checked=true;moveSelectedToFolder()}}
function v33PasswordFromContext(){const id=v33ContextId;closeV33Context();if(id!=null)setMediaPassword(id)}
function v33TrashFromContext(){const id=v33ContextId;closeV33Context();if(id!=null)trashItem(id)}
function closeV33Context(){v33ContextId=null;$("v33Context").classList.remove("show")}
function openV33Context(id,name){v33ContextId=id;$("v33ContextTitle").textContent=name||"写真・動画";$("v33Context").classList.add("show")}
function installV33LongPress(){
  const grid=$("grid");if(!grid||grid.dataset.v33Installed)return;grid.dataset.v33Installed="1";
  grid.addEventListener("pointerdown",e=>{
    const preview=e.target.closest(".preview");if(!preview||selectionMode)return;
    const card=preview.closest(".item"),cb=card?.querySelector(".mediaSelect");if(!cb)return;
    v33TouchMoved=false;v33StartX=e.clientX;v33StartY=e.clientY;clearTimeout(v33TouchTimer);
    v33TouchTimer=setTimeout(()=>{if(!v33TouchMoved){const id=Number(cb.dataset.id);const name=card.querySelector(".name")?.textContent||"写真・動画";openV33Context(id,name)}},650);
  });
  grid.addEventListener("pointermove",e=>{if(Math.hypot(e.clientX-v33StartX,e.clientY-v33StartY)>10){v33TouchMoved=true;clearTimeout(v33TouchTimer)}});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>grid.addEventListener(t,()=>clearTimeout(v33TouchTimer)));
}
function resetMediaZoom(){v33Scale=1;v33PanX=0;v33PanY=0;const el=$("mediaViewer")?.firstElementChild;if(el){el.classList.add("v33-zoomable");el.style.transform="translate(0px,0px) scale(1)"}}
function applyMediaZoom(){const el=$("mediaViewer")?.firstElementChild;if(el){el.classList.add("v33-zoomable");el.style.transform=`translate(${v33PanX}px,${v33PanY}px) scale(${v33Scale})`}}
function installV33MediaTouch(){const m=$("mediaModal");if(!m||m.dataset.v33Touch)return;m.dataset.v33Touch="1";
  m.addEventListener("touchstart",e=>{if(e.touches.length===1){v33StartX=e.touches[0].clientX;v33StartY=e.touches[0].clientY}else if(e.touches.length===2){v33PinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});
  m.addEventListener("touchmove",e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(v33PinchStart){v33Scale=Math.min(4,Math.max(1,v33Scale*(d/v33PinchStart)));v33PinchStart=d;applyMediaZoom()}}},{passive:true});
  m.addEventListener("touchend",e=>{if(e.changedTouches.length===1&&v33Scale<=1.05){const dx=e.changedTouches[0].clientX-v33StartX,dy=e.changedTouches[0].clientY-v33StartY;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.3){changeMedia(dx<0?1:-1)}}v33PinchStart=0});
}
// Hook existing functions without changing calculator layout.
const v33OriginalRender=render;
render=async function(){await v33OriginalRender();installV33LongPress();const s=$("sortSelect");if(s)s.value=getVaultSort();const r=$("trashRetention");if(r)r.value=localStorage.getItem("vaultTrashRetention")||"0";v33Activity()};
const v33OriginalRenderMedia=renderMedia;
renderMedia=function(){v33OriginalRenderMedia();resetMediaZoom();installV33MediaTouch()};
const v33OriginalCheck=check;
check=function(){v33OriginalCheck();setTimeout(()=>{if(secret)scheduleV33AutoLock()},50)};
const v33OriginalLock=lock;
lock=function(){clearTimeout(v33LockTimer);v33OriginalLock()};
// Clicking the existing history line opens the full calculation history.
$("historyText")?.addEventListener("click",openAuthHistory);
$("historyText")?.addEventListener("contextmenu",e=>{e.preventDefault();openAuthHistory()});
const authBtn=$("authShakeButton");
if(authBtn){
  authBtn.addEventListener("pointerdown",startAuthHold,{passive:false});
  ["pointerup","pointercancel"].forEach(ev=>authBtn.addEventListener(ev,endAuthHold,{passive:true}));
}
["pointerdown","touchstart","keydown","click"].forEach(ev=>document.addEventListener(ev,v33Activity,{passive:true}));
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./service-worker.js")}</script></body></html>
